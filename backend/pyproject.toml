[project]
name = "echosing-backend"
version = "0.1.0"
description = "AI-powered karaoke engine: ingestion pipeline, catalog API and scoring."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.20.0",
    "asyncpg>=0.32.0",
    "celery[redis]>=5.6.3",
    "fastapi>=0.142.2",
    "kombu>=5.6,<5.7",
    "numpy>=2.5.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "redis>=5.2",
    "sqlalchemy[asyncio]>=2.1.3",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false
# The "ml" group (CUDA wheels, ~3 GB) is installed by default; machines without
# an NVIDIA GPU can skip it with `uv sync --no-group ml`.
default-groups = ["dev", "ml"]
# PyTorch CUDA wheels only exist for Windows and Linux.
environments = ["sys_platform == 'win32'", "sys_platform == 'linux'"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "ANN", "D"]

[tool.ruff.lint.isort]
# The local alembic/ migrations folder must not shadow the alembic package.
known-third-party = ["alembic"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
"**/__init__.py" = ["D104"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
# ML packages are untyped or live in the optional "ml" group, which may be absent.
module = ["torch.*", "demucs.*", "whisper.*", "torchcrepe.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole run, so session-scoped async fixtures (e.g. the
# migrated test database engine) can be shared by every test.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not integration'"
markers = [
    "integration: requires the docker compose services (run with -m integration)",
]

[tool.coverage.run]
# SQLAlchemy's asyncio layer switches greenlets; without this, lines after an
# awaited database call are reported as not covered.
concurrency = ["greenlet", "thread"]

[dependency-groups]
dev = [
    "celery-types>=0.26.0",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.10",
]
ml = [
    "audio-separator>=0.47,<0.48",
    "audioread>=3.1",
    "demucs>=4.1.0",
    "onnxruntime>=1.30",
    "openai-whisper>=20250625",
    "torch==2.11.0",
    "torchaudio==2.11.0",
    "torchcrepe>=0.0.24",
    "torchvision==0.26.0",
]
