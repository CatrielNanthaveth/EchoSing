repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1000"]

  # Local hooks run through uv so they use the exact versions pinned in
  # backend/uv.lock, and mypy can see the project's dependencies.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run --directory backend ruff check --fix .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: ruff-format
        name: ruff format
        entry: uv run --directory backend ruff format .
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      - id: mypy
        name: mypy (strict)
        entry: uv run --directory backend mypy app tests scripts alembic
        language: system
        files: ^backend/.*\.py$
        pass_filenames: false
      # Web client: typecheck, lint and formatting (tests run in `npm run check`).
      - id: web-static-checks
        name: web (tsc, eslint, prettier)
        entry: npm --prefix web run static-checks
        language: system
        files: ^web/
        pass_filenames: false
